
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Job Application Suite</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0e0e0f;
    --surface: #161618;
    --surface2: #1e1e21;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.18);
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --gold-dim: rgba(201,168,76,0.12);
    --text: #f0ede6;
    --muted: #888580;
    --muted2: #555250;
    --success: #4caf7d;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(201,168,76,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,168,76,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 780px;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 3rem;
    animation: fadeUp 0.6s ease both;
  }

  .badge {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid rgba(201,168,76,0.3);
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 1rem;
    background: var(--gold-dim);
  }

  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 600;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 0.5rem;
  }

  .header h1 span { color: var(--gold); }

  .header p {
    font-size: 15px;
    color: var(--muted);
    font-weight: 300;
  }

  .gumroad-cta {
    margin-top: 1.5rem;
  }

  .gumroad-cta button {
    background-color: #FF6B6B;
    color: white;
    padding: 14px 32px;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    letter-spacing: 0.02em;
    transition: background 0.2s, transform 0.15s;
    box-shadow: 0 4px 20px rgba(255,107,107,0.35);
  }

  .gumroad-cta button:hover {
    background-color: #ff5252;
    transform: translateY(-1px);
  }

  .gumroad-cta button:active {
    transform: translateY(0);
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px;
    margin-bottom: 2rem;
    animation: fadeUp 0.6s 0.2s ease both;
  }

  .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: all 0.2s;
    color: var(--muted);
    border: none;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
  }

  .tab.active {
    background: var(--gold-dim);
    color: var(--gold);
    border: 1px solid rgba(201,168,76,0.25);
  }

  /* Panel */
  .panel { display: none; animation: fadeUp 0.4s ease both; }
  .panel.active { display: block; }

  /* Form */
  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem;
    margin-bottom: 1.5rem;
  }

  .form-card h2 {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

  .form-group { margin-bottom: 1.25rem; }
  .form-group:last-child { margin-bottom: 0; }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.2s;
    resize: vertical;
  }

  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus { border-color: var(--gold); }

  .form-group textarea { min-height: 90px; }

  .form-group select option { background: var(--surface2); }

  /* Tone chips */
  .tone-chips { display: flex; gap: 8px; flex-wrap: wrap; }

  .chip {
    padding: 6px 14px;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 20px;
    cursor: pointer;
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    transition: all 0.2s;
  }

  .chip:hover { border-color: var(--gold); color: var(--gold-light); }

  .chip.active {
    background: var(--gold-dim);
    border-color: rgba(201,168,76,0.4);
    color: var(--gold-light);
  }

  /* Generate Button */
  .btn-generate {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
    border: none;
    border-radius: var(--radius);
    color: #0e0e0f;
    font-size: 15px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    letter-spacing: 0.02em;
  }

  .btn-generate:hover { opacity: 0.92; }
  .btn-generate:active { transform: scale(0.99); }
  .btn-generate:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Output */
  .output-card {
    display: none;
    background: var(--surface);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: var(--radius);
    padding: 1.75rem;
    animation: fadeUp 0.4s ease both;
  }

  .output-card.visible { display: block; }

  .output-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.25rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }

  .output-header span {
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .output-badge {
    background: rgba(76,175,125,0.15);
    color: var(--success);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid rgba(76,175,125,0.2);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .output-text {
    font-size: 14px;
    line-height: 1.85;
    color: var(--text);
    white-space: pre-wrap;
    font-weight: 300;
  }

  .output-actions {
    display: flex;
    gap: 8px;
    margin-top: 1.25rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
  }

  .btn-action {
    padding: 8px 18px;
    font-size: 13px;
    cursor: pointer;
    border-radius: var(--radius-sm);
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    transition: all 0.2s;
  }

  .btn-action:hover { border-color: var(--gold); color: var(--gold); }

  /* Loading */
  .loading {
    display: none;
    text-align: center;
    padding: 2.5rem;
    color: var(--muted);
    font-size: 14px;
  }

  .loading.visible { display: block; }

  .spinner {
    width: 28px;
    height: 28px;
    border: 2px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 1rem;
  }

  /* Error */
  .error-msg {
    display: none;
    font-size: 13px;
    color: #e07070;
    background: rgba(224,112,112,0.08);
    border: 1px solid rgba(224,112,112,0.2);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    margin-top: 10px;
  }

  .error-msg.visible { display: block; }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 3rem;
    font-size: 12px;
    color: var(--muted2);
    letter-spacing: 0.05em;
  }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Responsive */
  @media (max-width: 540px) {
    .form-row { grid-template-columns: 1fr; }
    .wrapper { padding: 2rem 1rem 4rem; }
  }
</style>
</head>

<script>
  const tones = { cl: 'professional', rv: 'clean and professional' };

  // Soft paywall settings: 2 free generations, then send users to Gumroad.
  const FREE_GENERATION_LIMIT = 2;
  const PAYWALL_URL = 'https://eleveemporium.gumroad.com/l/pllrsk';
  let userEmail = localStorage.getItem('aiJobSuiteUserEmail') || '';
let usageData = JSON.parse(localStorage.getItem('aiJobSuiteUsageData') || '{}');
function getAccessEmail(prefix) {
  const emailInput = document.getElementById(prefix + '-access-email');
  const email = (emailInput?.value || userEmail || '').trim().toLowerCase();

  if (!email) {
    const errorEl = document.getElementById(prefix + '-error');
    errorEl.textContent = 'Please enter your email to start your 2 free generations.';
    errorEl.classList.add('visible');
    return '';
  }

  userEmail = email;
  localStorage.setItem('aiJobSuiteUserEmail', userEmail);
  return userEmail;
}
function checkLimit(prefix) {
  const email = getAccessEmail(prefix);
  if (!email) return false;

  if (!usageData[email]) usageData[email] = 0;
  if (usageData[email] < FREE_GENERATION_LIMIT) return true;

  const errorEl = document.getElementById(prefix + '-error');
  const outputEl = document.getElementById(prefix + '-output');

  if (outputEl) outputEl.classList.remove('visible');

  errorEl.innerHTML = `
    <strong>🔒 You're 1 step away from landing the job.</strong><br><br>
    You've used your ${FREE_GENERATION_LIMIT} free generations for ${email}.<br><br>
    Unlock unlimited access to:<br>
    • ATS-optimized resumes<br>
    • High-converting cover letters<br>
    • Job-specific keyword optimization<br><br>
    Stop guessing. Start getting interviews.
    <br><br>
    <a href="${PAYWALL_URL}" target="_blank" rel="noopener noreferrer" style="
      display:inline-block;
      padding:10px 16px;
      border-radius:8px;
      background:linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      color:#0e0e0f;
      text-decoration:none;
      font-weight:500;
    ">Unlock My Resume Tool</a>
  `;
  errorEl.classList.add('visible');
  return false;
}

  function increaseUsage() {
  if (!userEmail) return;
  if (!usageData[userEmail]) usageData[userEmail] = 0;
  usageData[userEmail] += 1;
  localStorage.setItem('aiJobSuiteUsageData', JSON.stringify(usageData));
}
  function switchTab(name) {
    document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0 && name==='cover')||(i===1 && name==='resume')));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
  }

  function selectTone(el, prefix, tone) {
    el.closest('.tone-chips').querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    tones[prefix] = tone;
  }

  function getVal(id) { return document.getElementById(id).value.trim(); }

  async function generate(prefix) {
    const errorEl = document.getElementById(prefix + '-error');
    errorEl.classList.remove('visible');
    errorEl.innerHTML = '';

    if (!checkLimit(prefix)) return;

    let prompt = '';
    if (prefix === 'cl') {
      const name = getVal('cl-name'), job = getVal('cl-job'), company = getVal('cl-company'), desc = getVal('cl-desc'), skills = getVal('cl-skills');
      if (!name || !job || !company || !skills) {
        errorEl.textContent = 'Please fill in all required cover letter fields.';
        errorEl.classList.add('visible');
        return;
      }
      prompt = `Write a ${tones.cl}, ATS-optimized, recruiter-focused cover letter for ${name} applying for the ${job} role at ${company}.

IMPORTANT INSTRUCTIONS:
- Keep the cover letter between 120–180 words (concise and impactful)
- Make it sound confident and slightly senior-level (not beginner or desperate)
- Focus on VALUE and impact, not just listing responsibilities
- Use strong action verbs (e.g., troubleshoot, resolve, support, optimize, deliver)
- Avoid fluff, repetition, and generic phrases
- Do NOT include placeholders or brackets
- Start with a strong, natural opening that immediately shows value or relevance to the role
- Avoid common or overused phrases (e.g., "I am excited to apply", "I am writing to express", "With hands-on experience")
- Do not start with "I'm applying" or similar intent-based phrases; start with value or capability instead
- The opening should feel human, specific, and slightly unique — not templated or generic
- Vary sentence structure so outputs do not sound repetitive or AI-generated
- Avoid repeating the same opening style across different generations
- Write like a real candidate speaking confidently, not like a formal template
- Naturally include relevant keywords from this job description: ${desc}
- Do NOT include placeholder text such as [Your Name], [Date], [Email], or similar
- Do NOT include a header section unless explicitly provided by the user
- Prioritize keywords like: technical support, troubleshooting, networking, system administration, customer support, IT operations (when relevant)
- Prefer concise, direct phrasing over soft or filler transitions (e.g., replace "Beyond technical proficiency" with stronger alternatives)

CANDIDATE DETAILS:
- Name: ${name}
- Role: ${job}
- Company: ${company}
- Skills & experience: ${skills}

STRUCTURE:
1. Strong opening (clear interest + role + company)
2. Technical value (skills + impact)
3. Customer/service strength (communication, problem-solving)
4. Growth + alignment with company
5. Short, confident closing

STYLE:
- Professional, modern, and clean
- No long paragraphs (max 2–3 lines each)
- No over-explaining

Output only the final cover letter text.`;
    } else {
      const name = getVal('rv-name'), job = getVal('rv-job'), email = getVal('rv-email'), phone = getVal('rv-phone'), edu = getVal('rv-edu'), skills = getVal('rv-skills'), desc = getVal('rv-desc'), exp = getVal('rv-exp');
      if (!name || !job || !skills) {
        errorEl.textContent = 'Please fill in at least your name, target job, and skills.';
        errorEl.classList.add('visible');
        return;
      }
      prompt = `Create a ${tones.rv}, ATS-optimized, recruiter-focused resume for ${name} targeting a ${job} role.
      
IMPORTANT INSTRUCTIONS:
- Make the resume concise, professional, and results-oriented
- Make it sound like a strong early-career (1–3 years equivalent) candidate, not a beginner
- Focus on IMPACT and outcomes, not just listing responsibilities
- Use strong action verbs (e.g., resolved, supported, optimized, configured, improved)
- Prefer concise, direct phrasing over soft or filler language
- Avoid repetition, fluff, and generic statements
- Do NOT include placeholders (e.g., [Your Name], [Date])
- Do NOT invent employers, dates, degrees, or experience not provided
- Include only fields that are provided (do not display missing or empty fields)

ATS OPTIMIZATION:
- Naturally include relevant keywords from this job description: ${desc}
- Prioritize keywords like: technical support, troubleshooting, networking, system administration, customer support, IT operations (when relevant)

CANDIDATE DETAILS:
- Name: ${name}
- Target Role: ${job}
- Email: ${email} 
- Phone: ${phone} 
- Education: ${edu}
- Skills & Experience: ${skills}

STRUCTURE:
1. Professional Summary (2–3 lines, strong and impact-focused)
2. Skills Section (group into clear categories such as Technical Skills, Tools, Systems; keep it clean and scannable)
3. Experience Section (bullet points with action + impact)
4. Education

EXPERIENCE BULLETS:
- Start each bullet with a strong action verb
- Show impact or outcome where possible (efficiency, reliability, user support)
- Keep bullets short and specific (1–2 lines max)
- Avoid weak phrases like "responsible for" or "helped with"
- Where exact metrics are unavailable, imply impact (e.g., improved efficiency, reduced downtime, enhanced user experience)
- Avoid weak verbs like "helped", "worked on", "assisted with" — replace with strong, specific actions

STYLE:
- Clean, modern, and easy to scan
- Use bullet points (not long paragraphs)
- No over-explaining
- Use consistent formatting (aligned sections, clear spacing, no clutter)

Output only the final resume text.`;

    }

    const btn = document.getElementById(prefix + '-btn');
    const originalBtnText = btn.textContent;
    btn.disabled = true;
    document.getElementById(prefix + '-loading').classList.add('visible');
    document.getElementById(prefix + '-output').classList.remove('visible');

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          messages: [{ role: 'user', content: prompt }]
        })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || err.details?.error?.message || `Error ${res.status}`);
      }

      const data = await res.json();
      const text = Array.isArray(data.content) ? data.content.map(i => i.text || '').join('') : '';
      if (!text) throw new Error('No output was returned.');
      document.getElementById(prefix + '-text').textContent = text;
      document.getElementById(prefix + '-output').classList.add('visible');
      increaseUsage();
    } catch (err) {
      errorEl.textContent = 'Error: ' + (err.message || 'Something went wrong. Check your API key and try again.');
      errorEl.classList.add('visible');
    } finally {
      btn.disabled = false;
      btn.textContent = originalBtnText;
      document.getElementById(prefix + '-loading').classList.remove('visible');
    }
  }

  function copyOutput(id, btn) {
    const text = document.getElementById(id).textContent;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      const original = btn.textContent;
      btn.textContent = 'Copied ✓';
      setTimeout(() => btn.textContent = original, 2000);
    });
  }

  function downloadOutput(id, filename) {
    const text = document.getElementById(id).textContent;
    const a = document.createElement('a');
    a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(text);
    a.download = filename;
    a.click();
  }
</script>
</body>
</html>
