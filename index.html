<!DOCTYPE html>
<html>
<head>
  <title>AI Job Suite</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    input, textarea, button {
      width: 100%;
      margin: 8px 0;
      padding: 10px;
    }

    button {
      background: black;
      color: white;
      border: none;
      cursor: pointer;
    }

    #output {
      white-space: pre-wrap;
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>

<h1>AI Resume & Cover Letter Generator</h1>

<input id="name" placeholder="Full Name">
<input id="jobTitle" placeholder="Job Title">
<input id="company" placeholder="Company (optional)">
<textarea id="description" placeholder="Job Description"></textarea>
<textarea id="skills" placeholder="Skills & Experience"></textarea>

<button onclick="generate()">Generate</button>

<div id="output"></div>

<button onclick="copyText()">Copy</button>
<button onclick="downloadText()">Download</button>

<script>

let usageCount = localStorage.getItem("usageCount") || 0;

// 🔒 PAYWALL CHECK
function checkLimit() {
  if (usageCount >= 2) {
    document.getElementById("output").innerHTML = `
      <div style="text-align:center;">
        <h2>🔒 Free Limit Reached</h2>
        <p>You’ve used your 2 free generations.</p>
        <a href="https://eleveemporium.gumroad.com" target="_blank">
          <button>Unlock Access</button>
        </a>
      </div>
    `;
    return false;
  }
  return true;
}

// ➕ Increase usage
function increaseUsage() {
  usageCount++;
  localStorage.setItem("usageCount", usageCount);
}

// 🚀 GENERATE FUNCTION
async function generate() {

  if (!checkLimit()) return;

  const name = document.getElementById("name").value;
  const jobTitle = document.getElementById("jobTitle").value;
  const company = document.getElementById("company").value;
  const description = document.getElementById("description").value;
  const skills = document.getElementById("skills").value;

  const prompt = `
Write a professional resume or cover letter.

Name: ${name}
Job Title: ${jobTitle}
Company: ${company}
Skills: ${skills}
Job Description: ${description}

Make it ATS-friendly and tailored.
`;

  const response = await fetch("/api/generate", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      messages: [
        {
          role: "user",
          content: prompt
        }
      ]
    })
  });

  const data = await response.json();

  if (data.error) {
    document.getElementById("output").innerText = data.error;
    return;
  }

  const text = data.content.map(c => c.text).join("\n\n");

  document.getElementById("output").innerText = text;

  increaseUsage();
}

// 📋 COPY
function copyText() {
  const text = document.getElementById("output").innerText;
  navigator.clipboard.writeText(text);
  alert("Copied!");
}

// 📄 DOWNLOAD
function downloadText() {
  const text = document.getElementById("output").innerText;
  const blob = new Blob([text], { type: "text/plain" });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "document.txt";
  a.click();
}

</script>

</body>
</html>
